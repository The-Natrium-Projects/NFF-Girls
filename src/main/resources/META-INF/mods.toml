    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
    
[[dependencies.${mod_id}]]
    modId="nffservices"
    mandatory=true
    versionRange="${services_version_range}"
    ordering="NONE"
    side="BOTH"  
    
[[dependencies.${mod_id}]]
    modId="hmag"
    mandatory=true
    versionRange="${hmag_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.nffgirls]]
